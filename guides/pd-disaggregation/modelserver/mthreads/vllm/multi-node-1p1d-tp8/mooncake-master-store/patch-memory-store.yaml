apiVersion: apps/v1
kind: Deployment
metadata:
  name: mooncake-master-store
spec:
  template:
    spec:
      containers:
        - name: mooncake-master-store
          # Keep Master and Client on the same in-memory Store mode for the
          # first validation. SSD offload is tested separately.
          args:
            - "--config_path=/etc/mooncake/master.yaml"
