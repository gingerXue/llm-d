apiVersion: v1
kind: PersistentVolume
metadata:
  name: mooncake-master-store-snapshots-local
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: mooncake-local
  hostPath:
    path: /ipfs/jzxue/k8s-workspace/mooncake-snapshots
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - worker36010
