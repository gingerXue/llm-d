apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply this overlay in a dedicated namespace. Prefill and Decode are pinned
# to the two current MThreads nodes below; change the selectors for another
# cluster.
resources:
  - ../../../../../recipes/modelserver/base/single-host/pd/vllm
  - mooncake-store-config.yaml

namePrefix: pd-disaggregation-mthreads-deepseek-v4-

components:
  - ../../../../../recipes/modelserver/components/images/mthreads-vllm/release
  - ../../../../../recipes/modelserver/components/images/routing-sidecar/nightly

images:
  - name: registry.mthreads.com/mcconline/inference/vllm
    newTag: v0.28.0-ph1-5.2.0-torch2.11.0.post2-20261001

labels:
  - pairs:
      llm-d.ai/model: DeepSeek-V4-Flash
      llm-d.ai/guide: pd-disaggregation
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: mthreads
      llm-d.ai/engine-type: vllm
    includeSelectors: true
    includeTemplates: true

patches:
  - path: patch-prefill.yaml
  - path: patch-decode.yaml
  - path: patch-sidecar.yaml
