apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-disaggregation-mthreads-vllm-decode
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker36010
      containers:
        - name: modelserver
          args:
            - /ipfs/models/Qwen3-32B
            - --served-model-name=Qwen3-32B
            - --host=0.0.0.0
            - --port=8200
            - --tensor-parallel-size=4
            - --dtype=bfloat16
            - --enforce-eager
            - --enable-prefix-caching
            - --max-model-len=8192
            - --max-num-seqs=16
            - --max-num-batched-tokens=8192
            - --gpu-memory-utilization=0.5
            - --disable-log-stats
            - --disable-access-log-for-endpoints=/health,/metrics,/v1/models
            - --kv-transfer-config
            - '{"kv_connector":"MultiConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail","kv_connector_extra_config":{"connectors":[{"kv_connector":"MooncakeConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"mooncake_protocol":"tcp"}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both"}]}}'
          env:
            - $patch: replace
            - name: MC_FORCE_TCP
              value: "1"
            - name: MC_TCP_MAX_QUEUED_TRANSFERS_PER_PEER
              value: "65535"
            - name: MC_TCP_MAX_PENDING_ADMISSIONS_PER_PEER
              value: "65535"
            - name: MOONCAKE_CONFIG_PATH
              value: /etc/mooncake/mooncake_config.json
            - name: MOONCAKE_PREFERRED_SEGMENT
              value: mooncake-client.mooncake.svc.cluster.local:50052
            - name: PYTHONHASHSEED
              value: "0"
            - name: VLLM_MOONCAKE_BOOTSTRAP_PORT
              value: "8998"
            - name: VLLM_PLUGINS
              value: musa,musa_custom_ops
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
            - name: USER
              value: llm-d
          volumeMounts:
            - name: qwen-model
              mountPath: /ipfs/models/Qwen3-32B
              readOnly: true
            - name: mooncake-config
              mountPath: /etc/mooncake
              readOnly: true
      volumes:
        - name: qwen-model
          hostPath:
            path: /ipfs/models/Qwen3-32B
            type: Directory
        - name: mooncake-config
          configMap:
            name: mooncake-store-config
